<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#161B20">
<title>Trucker's Assistant</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
:root{
  --bg:#EDF0F3; --surface:#FFFFFF; --ink:#12171C; --muted:#5B6673; --line:#DCE1E7;
  --blue:#0B4F9E; --blue-soft:#E3EEFA;
  --amber:#F5B800; --amber-soft:#FFF3CC; --amber-ink:#7A5A00;
  --green:#12855A; --green-soft:#DDF3E9;
  --red:#C93A30; --red-soft:#FBE3E0;
  --asphalt:#161B20;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0D1115; --surface:#171C22; --ink:#EEF1F4; --muted:#9AA5B1; --line:#29313A;
    --blue:#5AA2F0; --blue-soft:#14273D;
    --amber-soft:#3A3010; --amber-ink:#F5C94A;
    --green:#3CC98D; --green-soft:#123326;
    --red:#F07168; --red-soft:#3D1917;
    --asphalt:#0A0D10;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0}
body{
  background:var(--bg); color:var(--ink);
  font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-variant-numeric:tabular-nums;
}
#app{max-width:520px;margin:0 auto;min-height:100vh;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

/* ---------- Hero (ecranul principal) ---------- */
.hero{background:var(--asphalt);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 18px 20px}
.hero-top{display:flex;justify-content:space-between;align-items:center}
.who{font-weight:700;font-size:17px}
.truck{font-size:13.5px;color:#9AA5B1}
.icon-btn{width:44px;height:44px;border-radius:12px;border:0;background:rgba(255,255,255,.08);color:#fff;display:grid;place-items:center}
.icon-btn svg{width:22px;height:22px}
.mbar{display:flex;align-items:center;justify-content:space-between;margin-top:14px}
.mbar b{font-size:16px}
.mbar button{width:44px;height:44px;border-radius:12px;border:0;background:rgba(255,255,255,.08);color:#fff;font-size:22px;line-height:1}
.mbar button:disabled{opacity:.25}
.hero-lbl{margin-top:16px;font-size:14px;color:#B7C0CA}
.hero-num{font-size:52px;font-weight:800;line-height:1.05;letter-spacing:-1px}
.hero-num small{font-size:20px;font-weight:600;letter-spacing:0;color:#B7C0CA;margin-left:4px}
.hero-proj{margin-top:4px;font-size:14px;color:#B7C0CA}
.hero-proj b{color:#fff}
.road{display:flex;gap:4px;margin-top:18px}
.road i{flex:1;height:5px;background:rgba(255,255,255,.18);border-radius:1px}
.road i.on{background:var(--amber)}
.road-cap{margin-top:6px;font-size:12.5px;color:#9AA5B1}
.trio{display:grid;grid-template-columns:repeat(3,1fr)}
.trio>div{padding:2px 0 2px 14px;border-left:1px solid var(--line)}
.trio>div:first-child{border-left:0;padding-left:0}
.trio b{display:block;font-size:22px;font-weight:800}
.trio span{font-size:12.5px;color:var(--muted)}
.hero .trio{margin-top:18px}
.hero .trio>div{border-color:rgba(255,255,255,.14)}
.hero .trio span{color:#9AA5B1}

/* ---------- Structură comună ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(14px + env(safe-area-inset-top)) 16px 4px}
.top h1{margin:0;font-size:24px;font-weight:800}
.mbar-l{display:flex;align-items:center;gap:2px}
.mbar-l button{width:40px;height:40px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-size:20px}
.mbar-l button:disabled{opacity:.3}
.mbar-l b{min-width:118px;text-align:center;font-size:14.5px}
.block{background:var(--surface);border-block:1px solid var(--line);padding:16px;margin-top:8px}
.h{font-size:17px;font-weight:700;margin:0 0 12px}
.h-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.h-row .h{margin:0}
.link{background:none;border:0;color:var(--blue);font-weight:600;font-size:14.5px;padding:8px 0}
.muted{color:var(--muted)}
.empty{color:var(--muted);padding:6px 0 4px;font-size:15px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:58px;padding:11px 0;border-top:1px solid var(--line);cursor:pointer}
.row:first-of-type{border-top:0}
.row .t{font-weight:600}
.row .s{font-size:13.5px;color:var(--muted);margin-top:1px}
.row .r{text-align:right;flex:none}
.row .r b{font-size:16px}
.day-h{font-size:13.5px;font-weight:700;color:var(--muted);padding:14px 0 2px;border-bottom:1px solid var(--line)}
.day-h:first-child{padding-top:0}
.chip{display:inline-block;font-size:13px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap}
.chip.ok{background:var(--green-soft);color:var(--green)}
.chip.warn{background:var(--amber-soft);color:var(--amber-ink)}
.chip.bad{background:var(--red-soft);color:var(--red)}
.chip.none{background:var(--bg);color:var(--muted)}
.good{color:var(--green)} .mid{color:var(--amber-ink)} .bad{color:var(--red)}

.btn{display:block;width:100%;height:52px;border-radius:12px;border:0;font-weight:700;font-size:16px}
.btn.pri{background:var(--blue);color:#fff}
.btn.sec{background:transparent;border:1.5px solid var(--line)}
.btn.dng{background:transparent;color:var(--red)}
.btn+.btn{margin-top:8px}
.qa{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.qa button{height:80px;border-radius:12px;background:var(--bg);border:1.5px solid var(--line);font-weight:600;font-size:13.5px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.qa button svg{width:26px;height:26px}
.qa button.on{background:var(--green-soft);border-color:var(--green);color:var(--green)}

/* ---------- Instrument consum ---------- */
.gauge{max-width:280px;margin:0 auto;display:block;width:100%}
.g-val{text-align:center;margin-top:-6px}
.g-val b{font-size:38px;font-weight:800}
.g-val small{font-size:15px;color:var(--muted);margin-left:4px}
.g-cap{text-align:center;font-size:13.5px;color:var(--muted);margin-top:2px}

/* ---------- Salariu ---------- */
.sal-num{font-size:44px;font-weight:800;letter-spacing:-1px;line-height:1.1}
.sal-num small{font-size:18px;color:var(--muted);font-weight:600;margin-left:4px}
.line{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.line:first-of-type{border-top:0}
.line .d{font-size:13.5px;color:var(--muted)}
.line b{white-space:nowrap}
.note{margin-top:12px;padding:12px;border-radius:10px;background:var(--amber-soft);color:var(--amber-ink);font-size:14.5px}

/* ---------- Navigare jos ---------- */
#nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
#nav .in{display:flex;width:100%;max-width:520px}
#nav button{flex:1;height:66px;background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:600;color:var(--muted);position:relative}
#nav button svg{width:25px;height:25px}
#nav button.on{color:var(--blue)}
#nav button.on::before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;background:var(--amber);border-radius:0 0 3px 3px}
svg.i{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- Formulare ---------- */
.fl{display:block;font-weight:600;font-size:14.5px;margin:16px 0 6px}
.fl:first-child{margin-top:0}
.opt{font-weight:400;color:var(--muted);font-size:13px;margin-left:4px}
input[type=text],input[type=number],input[type=date],input[type=email],input[type=password],select{
  width:100%;height:50px;padding:0 12px;border-radius:10px;border:1.5px solid var(--line);
  background:var(--bg);color:var(--ink);font:inherit;font-size:16px
}
input:focus,select:focus{outline:none;border-color:var(--blue)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pay-opt{display:block;width:100%;text-align:left;padding:14px;margin-bottom:8px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg)}
.pay-opt b{display:block;font-size:16px}
.pay-opt span{font-size:13.5px;color:var(--muted)}
.pay-opt.on{border-color:var(--blue);background:var(--blue-soft)}
.sw-row{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:52px;border-top:1px solid var(--line)}
.sw-row label{font-weight:500;flex:1}
input.tg{appearance:none;-webkit-appearance:none;width:50px;height:30px;border-radius:15px;background:var(--line);position:relative;flex:none;margin:0;cursor:pointer}
input.tg::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s}
input.tg:checked{background:var(--blue)}
input.tg:checked::after{left:23px}
.sub{padding:0 0 8px}
.err{color:var(--red);font-size:14.5px;margin-top:10px;min-height:20px}

/* ---------- Foaie jos (sheet) ---------- */
.sheet-wrap{position:fixed;inset:0;z-index:50}
.backdrop{position:absolute;inset:0;background:rgba(0,0,0,.5)}
.sheet{position:absolute;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;background:var(--surface);border-radius:20px 20px 0 0;max-height:92vh;overflow:auto;padding:10px 18px calc(20px + env(safe-area-inset-bottom))}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.sheet h2{margin:0 0 16px;font-size:20px}

/* ---------- Onboarding ---------- */
#onb,#login{position:fixed;inset:0;z-index:60;background:var(--bg);overflow:auto}
.onb-in{max-width:520px;margin:0 auto;padding:calc(20px + env(safe-area-inset-top)) 20px 30px;min-height:100%;display:flex;flex-direction:column}
.steps{display:flex;gap:6px;margin-bottom:26px}
.steps i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.steps i.on{background:var(--amber)}
.onb-in h1{font-size:28px;margin:0 0 6px;line-height:1.15}
.onb-in p.lead{margin:0 0 22px;color:var(--muted)}
.onb-body{flex:1}
.onb-foot{display:flex;gap:10px;margin-top:22px}
.onb-foot .btn{margin:0}

.sync{display:inline-block;width:8px;height:8px;border-radius:50%;background:#3CC98D;margin-right:7px}
.sync.off{background:var(--amber)}
#toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--asphalt);color:#fff;padding:12px 18px;border-radius:12px;font-size:14.5px;z-index:70;max-width:90%;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div id="app"><main id="view"></main></div>

<nav id="nav"><div class="in">
  <button data-tab="home" onclick="showTab('home')"><svg class="i" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Acasă</button>
  <button data-tab="trips" onclick="showTab('trips')"><svg class="i" viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>Curse</button>
  <button data-tab="fuel" onclick="showTab('fuel')"><svg class="i" viewBox="0 0 24 24"><path d="M4 21V5a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v16"/><path d="M3 21h12"/><path d="M14 9h2a2 2 0 0 1 2 2v5a1.5 1.5 0 0 0 3 0V8l-3-3"/><path d="M7 8h4"/></svg>Consum</button>
  <button data-tab="pay" onclick="showTab('pay')"><svg class="i" viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/><path d="M6 12h.01M18 12h.01"/></svg>Salariu</button>
  <button data-tab="docs" onclick="showTab('docs')"><svg class="i" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 14l2 2 4-4"/></svg>Acte</button>
</div></nav>

<div class="sheet-wrap" id="sheetWrap" hidden>
  <div class="backdrop" onclick="closeSheet()"></div>
  <div class="sheet" id="sheet"></div>
</div>
<div id="onb" hidden></div>
<div id="login" hidden></div>
<div id="toast"></div>

<script>
/* =========================================================
   Date și utilitare
   ========================================================= */
const KEY='trucker_assistant_v2';
const firebaseConfig={
  apiKey:"AIzaSyCigD8dsroW7DsJWOicoh0M2rchrbI1cGc",
  authDomain:"istoric-camion.firebaseapp.com",
  databaseURL:"https://istoric-camion-default-rtdb.europe-west1.firebasedatabase.app/",
  projectId:"istoric-camion",
  storageBucket:"istoric-camion.firebasestorage.app",
  messagingSenderId:"826051116439",
  appId:"1:826051116439:web:a83f9de8b502f1b7a1d8d2"
};
let S=emptyState(), uid=null, userEmail='', auth=null, db=null, dataRef=null;
let online=false, decided=false, syncWarned=false;
let draft={};
const V={month:today().slice(0,7),tab:'home'};

function emptyState(){return {profile:null,trips:[],fuel:[],days:[],docs:[],updatedAt:0}}
function arr(x){return Array.isArray(x)?x.filter(v=>v!=null):(x&&typeof x==='object'?Object.values(x):[])}
function norm(r){
  r=r&&typeof r==='object'?r:{};
  return {profile:r.profile||null,trips:arr(r.trips),fuel:arr(r.fuel),days:arr(r.days),docs:arr(r.docs),updatedAt:Number(r.updatedAt)||0};
}
function loadLocal(id){
  try{
    let raw=localStorage.getItem(KEY+'_'+id), legacy=false;
    if(!raw){raw=localStorage.getItem(KEY);legacy=!!raw}
    if(raw){
      const r=norm(JSON.parse(raw));
      if(legacy){localStorage.setItem(KEY+'_'+id,JSON.stringify(r));localStorage.removeItem(KEY)}
      return r;
    }
  }catch(e){}
  return emptyState();
}
function saveLocal(){
  try{localStorage.setItem(KEY+'_'+uid,JSON.stringify(S))}catch(e){toast('Nu s-au putut salva datele pe telefon')}
}
function persist(){
  S.updatedAt=Date.now();
  saveLocal();
  push();
}
function push(){
  if(!uid||!db)return;
  db.ref('users/'+uid+'/taV2').set(JSON.parse(JSON.stringify(S))).catch(e=>{
    if(!syncWarned){syncWarned=true;toast('Nu s-a putut sincroniza. Datele rămân salvate pe telefon.')}
    console.warn('Sync',e);
  });
}

const $=id=>document.getElementById(id);
function p2(n){return String(n).padStart(2,'0')}
function today(){const d=new Date();return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())}
function parseD(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
function daysInMonth(mk){const [y,m]=mk.split('-').map(Number);return new Date(y,m,0).getDate()}
function shiftMonth(mk,n){const d=parseD(mk+'-01');d.setMonth(d.getMonth()+n);return d.getFullYear()+'-'+p2(d.getMonth()+1)}
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
function monthLabel(mk){return cap(parseD(mk+'-01').toLocaleDateString('ro-RO',{month:'long',year:'numeric'}))}
function dayLabel(s){return cap(parseD(s).toLocaleDateString('ro-RO',{weekday:'long',day:'numeric',month:'long'}))}
function shortDate(s){return parseD(s).toLocaleDateString('ro-RO',{day:'numeric',month:'short',year:'numeric'})}
const n0=v=>Math.round(v).toLocaleString('ro-RO');
const n1=v=>v.toLocaleString('ro-RO',{minimumFractionDigits:1,maximumFractionDigits:1});
const n2=v=>v.toLocaleString('ro-RO',{minimumFractionDigits:2,maximumFractionDigits:2});
const sum=(a,f)=>a.reduce((s,x)=>s+(Number(f(x))||0),0);
const newId=()=>Date.now()*1000+Math.floor(Math.random()*1000);
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
let toastT;
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2200)}

/* =========================================================
   Calcule: salariu, consum, acte
   ========================================================= */
function calc(mk){
  const p=S.profile||{};
  const trips=S.trips.filter(t=>t.data.startsWith(mk));
  const days=new Set(trips.map(t=>t.data));
  S.days.forEach(d=>{if(d.startsWith(mk))days.add(d)});
  const km=sum(trips,t=>t.km), tone=sum(trips,t=>t.tonaj);
  const sat=[...days].filter(d=>parseD(d).getDay()===6).length;
  const lines=[];
  let total=0, main=0;

  if(p.baza>0){lines.push({l:'Salariu de bază',d:'Sumă fixă lunară',v:p.baza});total+=p.baza}
  if(p.payType==='per_trip'){
    main=sum(trips,t=>t.suma!=null&&t.suma!==''?t.suma:p.rate);
    lines.push({l:'Curse',d:trips.length+(trips.length===1?' cursă':' curse')+' × '+n2(p.rate)+' '+M(),v:main});
  }else if(p.payType==='per_day'){
    main=days.size*p.rate;
    lines.push({l:'Zile lucrate',d:days.size+(days.size===1?' zi':' zile')+' × '+n2(p.rate)+' '+M(),v:main});
  }else if(p.payType==='per_km'){
    main=km*p.rate;
    lines.push({l:'Kilometri',d:n0(km)+' km × '+n2(p.rate)+' '+M(),v:main});
  }
  total+=main;
  let satPay=0, meal=0;
  if(p.sambata>0 && sat>0){satPay=sat*p.sambata;lines.push({l:'Sâmbete lucrate',d:sat+' × '+n2(p.sambata)+' '+M(),v:satPay});total+=satPay}
  if(p.masa>0 && days.size>0){meal=days.size*p.masa;lines.push({l:'Bonuri de masă',d:days.size+' zile × '+n2(p.masa)+' '+M(),v:meal});total+=meal}

  // estimare la final de lună (doar luna curentă)
  let proj=null;
  const cur=today().slice(0,7);
  if(mk===cur){
    const dim=daysInMonth(mk), dn=parseInt(today().slice(8));
    const wd=n=>{let c=0;for(let i=1;i<=n;i++){const g=new Date(parseD(mk+'-01').getFullYear(),parseD(mk+'-01').getMonth(),i).getDay();if(g>0&&g<6)c++}return c};
    const el=wd(dn), all=wd(dim);
    if(el>=3){
      const est=(p.baza||0)+(main+meal)*all/el+satPay;
      if(est>total*1.02) proj=est;
    }
  }
  return {total,lines,days:days.size,trips:trips.length,km,tone,sat,proj};
}

function intervals(){
  const f=[...S.fuel].sort((a,b)=>a.km-b.km);
  let last=null,acc=0;const out=[];
  f.forEach(e=>{
    acc+=Number(e.litri)||0;
    if(e.plin){
      if(last){const dist=e.km-last.km;if(dist>0)out.push({id:e.id,data:e.data,dist,litri:acc,consum:acc/dist*100})}
      last=e;acc=0;
    }
  });
  return out;
}
function fuelMonth(mk){
  const iv=intervals().filter(i=>i.data.startsWith(mk));
  const dist=sum(iv,i=>i.dist), l=sum(iv,i=>i.litri);
  const ent=S.fuel.filter(e=>e.data.startsWith(mk));
  return {avg:dist>0?l/dist*100:null,dist,litri:sum(ent,e=>e.litri),cost:sum(ent,e=>e.pret?e.litri*e.pret:0),last:iv.length?iv[iv.length-1]:null,count:ent.length};
}
function consClass(v){
  const t=S.profile&&S.profile.tinta;
  if(!t||v==null)return '';
  return v<=t?'good':v<=t+2.5?'mid':'bad';
}

function docStatus(exp){
  if(!exp)return {k:'none',text:'Fără dată',days:null};
  const d=Math.round((parseD(exp)-parseD(today()))/86400000);
  if(d<0)return {k:'bad',text:d===-1?'Expirat ieri':'Expirat de '+(-d)+' zile',days:d};
  if(d===0)return {k:'bad',text:'Expiră azi',days:d};
  if(d<=30)return {k:'warn',text:d===1?'Expiră mâine':'Expiră în '+d+' zile',days:d};
  return {k:'ok',text:'Valabil',days:d};
}

/* =========================================================
   Componente vizuale
   ========================================================= */
function gauge(val,target){
  const cx=130,cy=128,R=100,MIN=20,MAX=50;
  const ang=v=>Math.PI*(1-(Math.max(MIN,Math.min(MAX,v))-MIN)/(MAX-MIN));
  const pt=(r,v)=>[cx+r*Math.cos(ang(v)),cy-r*Math.sin(ang(v))];
  const arc=(a,b)=>{const [x1,y1]=pt(R,a),[x2,y2]=pt(R,b);return `M${x1.toFixed(1)} ${y1.toFixed(1)}A${R} ${R} 0 0 1 ${x2.toFixed(1)} ${y2.toFixed(1)}`};
  const seg=(a,b,c)=>b>a?`<path d="${arc(a,b)}" style="stroke:var(${c})" stroke-width="16" fill="none"/>`:'';
  let s='';
  if(target){
    const t=Math.max(MIN,Math.min(MAX,target)), t2=Math.min(MAX,t+2.5);
    s+=seg(MIN,t,'--green')+seg(t,t2,'--amber')+seg(t2,MAX,'--red');
  }else s+=seg(MIN,MAX,'--line');
  let needle='';
  if(val!=null){
    const [x,y]=pt(R-24,val);
    needle=`<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" style="stroke:var(--ink)" stroke-width="4" stroke-linecap="round"/><circle cx="${cx}" cy="${cy}" r="8" style="fill:var(--ink)"/>`;
  }
  return `<svg class="gauge" viewBox="0 0 260 150" role="img" aria-label="Consum mediu">${s}${needle}
    <text x="30" y="148" text-anchor="middle" font-size="12" style="fill:var(--muted)">20</text>
    <text x="230" y="148" text-anchor="middle" font-size="12" style="fill:var(--muted)">50</text></svg>`;
}
function gaugeBlock(f){
  const t=S.profile.tinta;
  const cls=consClass(f.avg);
  let cap='';
  if(f.avg==null) cap='Fă două alimentări „plin de tot” ca să vezi consumul.';
  else cap=t?`Țintă: ${n1(t)} L/100 km`:'Setează o țintă în profil ca să vezi zonele de culoare.';
  return `${gauge(f.avg,t)}
    <div class="g-val ${cls}"><b>${f.avg==null?'–':n1(f.avg)}</b><small>L/100 km</small></div>
    <div class="g-cap">${cap}</div>`;
}
function monthBar(){
  const cur=today().slice(0,7);
  return `<button aria-label="Luna precedentă" onclick="chMonth(-1)">‹</button><b>${monthLabel(V.month)}</b><button aria-label="Luna următoare" onclick="chMonth(1)" ${V.month>=cur?'disabled':''}>›</button>`;
}
function head(title){return `<div class="top"><h1>${title}</h1><div class="mbar-l">${monthBar()}</div></div>`}
function roadLine(mk){
  const cur=today().slice(0,7), dim=daysInMonth(mk);
  const done=mk<cur?dim:mk===cur?parseInt(today().slice(8)):0;
  const cap=mk<cur?'Lună încheiată':mk===cur?`Ziua ${done} din ${dim}`:'Lună viitoare';
  return `<div class="road" aria-hidden="true">${Array.from({length:dim},(_,i)=>`<i class="${i<done?'on':''}"></i>`).join('')}</div><div class="road-cap">${cap}</div>`;
}

function saveTrip(id){
  const g=x=>$(x)?$(x).value.trim():'';
  const num=x=>{const v=parseFloat(g(x));return isNaN(v)?null:v};
  if(!g('t_data')){$('err').textContent='Alege data.';return}
  const rec={id:id||newId(),data:g('t_data'),client:g('t_client'),marfa:g('t_marfa'),tonaj:num('t_tonaj'),km:num('t_km'),suma:num('t_suma')};

  if(!$('a_data').value){$('err').textContent='Alege data.';return}
  if(!(km>0)){$('err').textContent='Trece kilometrajul de pe bord.';return}
  if(!(litri>0)){$('err').textContent='Trece litrii alimentați.';return}
  const rec={id:id||newId(),data:$('a_data').value,km,litri,pret:pret>0?pret:null,plin:$('a_plin').checked};
  if(id)S.fuel=S.fuel.map(x=>x.id===id?rec:x);else S.fuel.push(rec);
  persist();closeSheet();render();toast('Alimentare salvată');
}

/* ----- Acte ----- */
function openDoc(id){
  const d=id?S.docs.find(x=>x.id===id):null;
  openSheet(d?esc(d.nume):'Act nou',`
    ${d?'':`<label class="fl" for="d_nume">Numele actului</label><input type="text" id="d_nume" placeholder="ex: CASCO, adeverință ADR">
    <label class="fl" for="d_grup">Aparține</label><select id="d_grup"><option value="camion">Camionului</option><option value="sofer">Șoferului</option></select>`}
    <label class="fl" for="d_exp">Valabil până la</label><input type="date" id="d_exp" value="${d&&d.expira||''}">
    <div class="err" id="err"></div>
    <button class="btn pri" onclick="saveDoc(${id||0})">Salvează</button>
    ${d?`<button class="btn dng" onclick="delItem('docs',${d.id})">Șterge actul</button>`:''}`);
}
function saveDoc(id){
  const exp=$('d_exp').value;
  if(id){S.docs=S.docs.map(x=>x.id===id?{...x,expira:exp}:x)}
  else{
    const n=$('d_nume').value.trim();
    if(!n){$('err').textContent='Scrie numele actului.';return}
    S.docs.push({id:newId(),nume:n,grup:$('d_grup').value,expira:exp});
  }
  persist();closeSheet();render();toast('Act salvat');
}

/* ----- Zile lucrate ----- */
function toggleToday(){
  const t=today();
  if(S.trips.some(x=>x.data===t)){toast('Ai curse azi, ziua e deja numărată');return}
  if(S.days.includes(t)){S.days=S.days.filter(d=>d!==t);toast('Ziua de azi a fost scoasă')}
  else{S.days.push(t);toast('Azi e marcată ca zi lucrată')}
  persist();render();
}
function openDays(){
  const list=S.days.filter(d=>d.startsWith(V.month)).sort().reverse();
  openSheet('Zile lucrate fără cursă',`
    <label class="fl" for="z_data">Data</label><input type="date" id="z_data" value="${V.month===today().slice(0,7)?today():V.month+'-01'}">
    <button class="btn pri" style="margin-top:14px" onclick="addDay()">Marchează ziua</button>
    <div class="h" style="margin:22px 0 4px">Marcate în ${monthLabel(V.month).toLowerCase()}</div>
    ${list.length?list.map(d=>`<div class="row" style="cursor:default"><div class="t">${dayLabel(d)}</div><button class="link" onclick="rmDay('${d}')">Scoate</button></div>`).join(''):'<div class="empty">Nicio zi marcată manual.</div>'}`);
}
function addDay(){
  const d=$('z_data').value;if(!d)return;
  if(!S.days.includes(d))S.days.push(d);
  persist();render();openDays();toast('Zi marcată');
}
function rmDay(d){S.days=S.days.filter(x=>x!==d);persist();render();openDays()}

function delItem(coll,id){
  if(!confirm('Ștergi definitiv?'))return;
  S[coll]=S[coll].filter(x=>x.id!==id);
  persist();closeSheet();render();toast('Șters');
}

/* =========================================================
   Profil: formulare comune pentru configurare și setări
   ========================================================= */
const rateLabel=(t,p)=>({per_trip:'Cât primești pe cursă',per_day:'Cât primești pe zi',per_km:'Cât primești pe kilometru'})[t]?({per_trip:'Cât primești pe cursă',per_day:'Cât primești pe zi',per_km:'Cât primești pe kilometru'})[t]+' ('+M(p)+')':'Suma ('+M(p)+')';
function fIdentity(p){
  return `<label class="fl" for="f_nume">Cum te cheamă? <span class="opt">opțional</span></label><input type="text" id="f_nume" value="${esc(p.nume)}" autocomplete="given-name">
  <label class="fl" for="f_camion">Număr de înmatriculare <span class="opt">opțional</span></label><input type="text" id="f_camion" value="${esc(p.camion)}" placeholder="PH 00 ABC" autocapitalize="characters">`;
}
function fPay(p){
  const T=[['per_trip','Pe cursă','Primești o sumă pentru fiecare cursă'],['per_day','Pe zi','Primești o sumă pentru fiecare zi lucrată'],['per_km','Pe kilometru','Primești o sumă pentru fiecare km parcurs']];
  return `<div class="fl">Cum ești plătit?</div>`+T.map(([k,t,d])=>`<button type="button" class="pay-opt ${p.payType===k?'on':''}" data-t="${k}" onclick="pickPay('${k}')"><b>${t}</b><span>${d}</span></button>`).join('')+
  `<label class="fl" for="f_moneda">Moneda în care ești plătit</label><select id="f_moneda" onchange="curChanged()">${CURRENCIES.map(c=>`<option value="${c[0]}" ${(p.moneda||'RON')===c[0]?'selected':''}>${c[2]}</option>`).join('')}</select>
  <label class="fl" for="f_rate" id="f_rate_l">${rateLabel(p.payType,p)}</label><input type="number" id="f_rate" inputmode="decimal" step="0.01" value="${p.rate||''}">
  <label class="fl" for="f_baza">Salariu de bază fix <span class="opt">opțional, <span class="mny">${M(p)}</span> pe lună</span></label><input type="number" id="f_baza" inputmode="decimal" step="0.01" value="${p.baza||''}">`;
}
function fExtras(p){
  return `<div class="fl">Sporuri</div>
  <div class="sw-row"><label for="f_sat_on">Sâmbăta lucrată se plătește separat</label><input class="tg" type="checkbox" id="f_sat_on" ${p.sambata>0?'checked':''} onchange="$('f_sat_sub').hidden=!this.checked"></div>
  <div class="sub" id="f_sat_sub" ${p.sambata>0?'':'hidden'}><label class="fl" for="f_sat">Sumă pe sâmbătă lucrată (<span class="mny">${M(p)}</span>)</label><input type="number" id="f_sat" inputmode="decimal" step="0.01" value="${p.sambata||''}"></div>
  <div class="sw-row"><label for="f_masa_on">Primești bon de masă sau diurnă</label><input class="tg" type="checkbox" id="f_masa_on" ${p.masa>0?'checked':''} onchange="$('f_masa_sub').hidden=!this.checked"></div>
  <div class="sub" id="f_masa_sub" ${p.masa>0?'':'hidden'}><label class="fl" for="f_masa">Sumă pe zi lucrată (<span class="mny">${M(p)}</span>)</label><input type="number" id="f_masa" inputmode="decimal" step="0.01" value="${p.masa||''}"></div>
  <label class="fl" for="f_tinta">Consum țintă <span class="opt">opțional, L/100 km</span></label><input type="number" id="f_tinta" inputmode="decimal" step="0.1" value="${p.tinta||''}" placeholder="ex: 32">
  <div class="muted" style="font-size:13.5px;margin-top:6px">Cu o țintă, indicatorul de consum arată verde, galben sau roșu.</div>`;
}
function readForm(d){
  const g=id=>$(id), num=id=>g(id)?(parseFloat(g(id).value)||0):0;
  if(g('f_nume')){d.nume=g('f_nume').value.trim();d.camion=g('f_camion').value.trim().toUpperCase()}
  if(g('f_rate')){d.rate=num('f_rate');d.baza=num('f_baza');if(g('f_moneda'))d.moneda=g('f_moneda').value}
  if(g('f_sat_on')){
    d.sambata=g('f_sat_on').checked?num('f_sat'):0;
    d.masa=g('f_masa_on').checked?num('f_masa'):0;
    d.tinta=num('f_tinta');
  }
  return d;
}
function pickPay(t){
  draft.payType=t;
  document.querySelectorAll('.pay-opt').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  $('f_rate_l').textContent=rateLabel(t,draft);
  $('f_rate').focus();
}
function curChanged(){
  draft.moneda=$('f_moneda').value;
  document.querySelectorAll('.mny').forEach(e=>e.textContent=M(draft));
  const l=$('f_rate_l');if(l)l.textContent=rateLabel(draft.payType,draft);
}
function validatePay(d){
  if(!d.payType)return 'Alege cum ești plătit.';
  if(!(d.rate>0))return 'Trece suma pe care o primești.';
  return '';
}

/* ----- Prima pornire ----- */
let onbStep=1;
function startOnboarding(){draft={moneda:'RON',payType:'',rate:0,baza:0,sambata:0,masa:0,tinta:0,nume:'',camion:''};onbStep=1;onbRender();$('onb').hidden=false}
function onbRender(){
  const titles={1:['Bun venit','Configurezi aplicația în 3 pași. Datele rămân pe telefonul tău.',fIdentity],2:['Cum ești plătit?','Din asta se calculează salariul tău în fiecare lună.',fPay],3:['Sporuri și consum','Adaugă doar ce primești tu. Poți schimba oricând din setări.',fExtras]};
  const [h,l,fn]=titles[onbStep];
  $('onb').innerHTML=`<div class="onb-in"><div class="steps">${[1,2,3].map(i=>`<i class="${i<=onbStep?'on':''}"></i>`).join('')}</div>
    <h1>${h}</h1><p class="lead">${l}</p><div class="onb-body">${fn(draft)}<div class="err" id="err"></div></div>
    <div class="onb-foot">${onbStep>1?'<button class="btn sec" onclick="onbBack()">Înapoi</button>':''}<button class="btn pri" onclick="onbNext()">${onbStep===3?'Începe':'Continuă'}</button></div></div>`;
  $('onb').scrollTop=0;
}
function onbBack(){readForm(draft);onbStep--;onbRender()}
function onbNext(){
  readForm(draft);
  if(onbStep===2){const e=validatePay(draft);if(e){$('err').textContent=e;return}}
  if(onbStep<3){onbStep++;onbRender();return}
  S.profile=draft;
  if(!S.docs.length)S.docs=DEFAULT_DOCS.map(([nume,grup])=>({id:newId(),nume,grup,expira:''}));
  persist();$('onb').hidden=true;V.tab='home';render();
  toast('Gata. Adaugă prima cursă.');
}

/* ----- Setări ----- */
function openSettings(){
  draft={...S.profile};
  openSheet('Profil și plată',`<div class="row" style="cursor:default;border-top:0;margin-bottom:6px"><div><div class="t">Cont</div><div class="s">${esc(userEmail)}</div></div><button class="link" onclick="doLogout()">Ieși din cont</button></div>${fIdentity(draft)}<div style="height:6px"></div>${fPay(draft)}<div style="height:6px"></div>${fExtras(draft)}
    <div class="err" id="err"></div>
    <button class="btn pri" onclick="saveSettings()">Salvează</button>
    <div class="h" style="margin:28px 0 8px">Copie de siguranță</div>
    <div class="muted" style="font-size:14px;margin-bottom:10px">Datele sunt doar pe acest telefon. Salvează o copie ca să nu le pierzi.</div>
    <button class="btn sec" onclick="exportData()">Salvează copia în telefon</button>
    <label class="btn sec" style="display:grid;place-items:center;margin-top:8px;cursor:pointer">Încarcă o copie<input type="file" accept=".json,application/json" hidden onchange="importData(event)"></label>
    <button class="btn dng" style="margin-top:8px" onclick="wipe()">Șterge toate datele</button>`);
}
function saveSettings(){
  readForm(draft);
  const e=validatePay(draft);if(e){$('err').textContent=e;return}
  S.profile=draft;persist();closeSheet();render();toast('Profil salvat');
}
function exportData(){
  const b=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='trucker-assistant-'+today()+'.json';
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function importData(ev){
  const f=ev.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      if(!d||!Array.isArray(d.trips)||!d.profile)throw 0;
      S={profile:d.profile,trips:d.trips||[],fuel:d.fuel||[],days:d.days||[],docs:d.docs||[]};
      persist();closeSheet();render();toast('Datele au fost încărcate');
    }catch(e){toast('Fișier nevalid')}
  };
  r.readAsText(f);
}
function wipe(){
  if(!confirm('Ștergi tot: profil, curse, alimentări, acte? Nu se poate anula.'))return;
  S={profile:null,trips:[],fuel:[],days:[],docs:[]};
  persist();closeSheet();startOnboarding();
}

/* =========================================================
   Pornire
   ========================================================= */

/* =========================================================
   Cont și sincronizare (Firebase)
   ========================================================= */
const syncText=()=>online?'Sincronizat':'Fără internet, datele rămân pe telefon';
function updSync(){
  document.querySelectorAll('.sync').forEach(e=>e.classList.toggle('off',!online));
  document.querySelectorAll('.sync-t').forEach(e=>e.textContent=syncText());
}
function showLogin(msg){
  $('login').innerHTML=`<div class="onb-in"><div class="onb-body" style="padding-top:8vh">
    <h1>Trucker's Assistant</h1><p class="lead">Intră în cont ca să-ți păstrezi cursele, consumul și actele în siguranță, pe orice telefon.</p>
    <label class="fl" for="l_email">Email</label><input type="email" id="l_email" autocomplete="username" autocapitalize="none" spellcheck="false" inputmode="email">
    <label class="fl" for="l_pass">Parolă</label><input type="password" id="l_pass" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
    <div class="err" id="l_err">${esc(msg||'')}</div>
    <button class="btn pri" onclick="doLogin()">Intră în cont</button>
    <button class="btn sec" onclick="doSignup()">Creează cont nou</button>
    <button class="link" style="margin-top:10px" onclick="resetPass()">Ai uitat parola?</button>
  </div></div>`;
  $('login').hidden=false;
}
const AUTH_ERR={
  'auth/user-not-found':'Nu există cont cu acest email.',
  'auth/wrong-password':'Parolă greșită.',
  'auth/invalid-credential':'Email sau parolă greșite.',
  'auth/invalid-email':'Emailul nu este valid.',
  'auth/email-already-in-use':'Există deja un cont cu acest email. Apasă „Intră în cont”.',
  'auth/weak-password':'Parola are minim 6 caractere.',
  'auth/network-request-failed':'Fără internet. Încearcă din nou.',
  'auth/too-many-requests':'Prea multe încercări. Așteaptă câteva minute.'
};
function authBusy(b){document.querySelectorAll('#login button').forEach(x=>x.disabled=b)}
function authErr(e){$('l_err').textContent=AUTH_ERR[e.code]||('Eroare: '+(e.message||e));authBusy(false)}
function creds(){
  if(!auth){$('l_err').textContent='Serviciul de conectare nu s-a încărcat. Verifică internetul și redeschide aplicația.';return null}
  const em=$('l_email').value.trim().toLowerCase(), pw=$('l_pass').value;
  if(!em||!pw){$('l_err').textContent='Completează emailul și parola.';return null}
  return {em,pw};
}
function doLogin(){const c=creds();if(!c)return;$('l_err').textContent='';authBusy(true);auth.signInWithEmailAndPassword(c.em,c.pw).catch(authErr)}
function doSignup(){
  const c=creds();if(!c)return;
  if(c.pw.length<6){$('l_err').textContent='Parola are minim 6 caractere.';return}
  $('l_err').textContent='';authBusy(true);
  auth.createUserWithEmailAndPassword(c.em,c.pw).catch(authErr);
}
function resetPass(){
  if(!auth){creds();return}
  const em=$('l_email').value.trim().toLowerCase();
  if(!em){$('l_err').textContent='Scrie emailul mai sus, apoi apasă din nou.';return}
  auth.sendPasswordResetEmail(em).then(()=>{$('l_err').textContent='Ți-am trimis un email cu link pentru parola nouă.'}).catch(authErr);
}
function doLogout(){
  if(!confirm('Ieși din cont pe acest telefon? Datele rămân salvate în cont.'))return;
  closeSheet();auth.signOut();
}

function decide(){
  if(decided)return;decided=true;
  if(S.profile){$('onb').hidden=true;render()}else startOnboarding();
}
function attachData(){
  detachData();
  decided=false;
  if(S.profile)decide();else setTimeout(decide,4000);
  dataRef=db.ref('users/'+uid+'/taV2');
  dataRef.on('value',snap=>{
    const v=snap.val();
    if(!v){ if(S.profile||S.trips.length||S.fuel.length)push(); decide(); return }
    const r=norm(v);
    if(r.updatedAt>(S.updatedAt||0)){
      S=r;saveLocal();decided=true;
      if(S.profile){$('onb').hidden=true;render()}else if($('onb').hidden)startOnboarding();
    }else if(r.updatedAt<(S.updatedAt||0)){push()}
    decide();
  },err=>{
    console.warn(err);
    if(!syncWarned){syncWarned=true;toast('Nu am acces la datele din cont. Lucrezi pe datele de pe telefon.')}
    decide();
  });
}
function detachData(){if(dataRef){dataRef.off();dataRef=null}}

function initAuth(){
  if(typeof firebase==='undefined'){showLogin('Serviciul de conectare nu s-a încărcat. Verifică internetul și redeschide aplicația.');return}
  firebase.initializeApp(firebaseConfig);
  auth=firebase.auth();db=firebase.database();
  db.ref('.info/connected').on('value',s=>{online=!!s.val();updSync()});
  auth.onAuthStateChanged(u=>{
    if(u){
      uid=u.uid;userEmail=u.email||'';
      S=loadLocal(uid);
      $('login').hidden=true;
      attachData();
    }else{
      detachData();uid=null;userEmail='';S=emptyState();
      $('onb').hidden=true;$('sheetWrap').hidden=true;$('view').innerHTML='';
      showLogin();
    }
  });
}
initAuth();
</script>
</body>
</html>
